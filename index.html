<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            background-color: #1e1e1e;
            color: #ccc;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        h1 {
            color: #00aaff;
            font-size: 40px;
        }
        .card {
            background-color: #2b2b2b;
            width: 60%;
            margin: 100px auto;
            padding: 30px;
            border: 2px solid #00aaff;
            border-radius: 15px;
            box-shadow: 0 0 20px #00aaff;
        }
        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #00aaff;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
            transition: 0.3s;
        }
        .btn:hover {
            background-color: #00ff00;
            box-shadow: 0 0 15px #00ff00;
        }
        .avatar {
            width:120px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid #00aaff;
            object-fit: cover;
            margin-bottoms: 10px;
        }
        h2 {
            color: #00aaff;
            font-size: 24px;
            margin-top: 30px;
        }
        ul {
            list-style-type: none;
            padding: 0;
        }
        li {
            color: #ccc;
            margin: 8px 0;
            font-size: 18ps;
        }
    </style>
    <title>My first page</title>
</head>
<body>
    <div class="card">
        <h1>Raythxr</h1>
        <img src="avatar.jpg" alt="My avatar" class="avatar">
        <p>This is my first site written in HTML</p>
        <p>I can write code in Python and create Telegram bots.</p>
        <a href="https://github.com/raythxr" target="_blank" class="btn">My GitHub</a>
        <h2>My projects:</h2>
        <ul>
            <li>1. Text-based RPG "Arena" (Python, OOP)</li>
            <li>2. Telegram bot for tracking expenses (Python,JSON)</li>
            <li>3. This site (HTML,CSS)</li>
        </ul>
    </div>
</body>
</html>
